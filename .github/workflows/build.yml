name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Dylib for iOS (arm64)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -install_name @rpath/HaiderUI.dylib \
            -o HaiderUI.dylib Welcome.m

      - name: Ad-hoc Sign Dylib
        run: codesign -f -s - HaiderUI.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaiderUI-Dylib
          path: HaiderUI.dylib
